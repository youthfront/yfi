<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="5" fill="#282420"/>

  <!-- Raised index finger — simplified to clean geometry -->
  <!-- Palm base -->
  <rect x="10" y="20" width="12" height="7" rx="2" fill="#E89C18"/>
  <!-- Finger shaft -->
  <rect x="13" y="8" width="6" height="15" rx="3" fill="#E89C18"/>
  <!-- Fingertip rounded -->
  <rect x="13" y="8" width="6" height="6" rx="3" fill="#E89C18"/>

  <!-- Ink line — a single vertical stroke cutting through the finger -->
  <!-- This is the pen: the act of writing inside the act of speaking -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#282420" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>

  <!-- Nib split at fingertip — the pen speaks -->
  <line x1="16" y1="9" x2="14" y2="12" stroke="#282420" stroke-width="1" stroke-linecap="round" opacity=".55"/>
  <line x1="16" y1="9" x2="18" y2="12" stroke="#282420" stroke-width="1" stroke-linecap="round" opacity=".55"/>
</svg>
