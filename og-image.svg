<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#282420"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="90"  x2="1200" y2="90"  stroke="rgba(232,156,24,.03)" stroke-width="1"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(232,156,24,.03)" stroke-width="1"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="rgba(232,156,24,.03)" stroke-width="1"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(232,156,24,.03)" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(232,156,24,.03)" stroke-width="1"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(232,156,24,.03)" stroke-width="1"/>

  <!-- Large mark — raised finger with pen score, top left -->
  <!-- Palm -->
  <rect x="80" y="310" width="90" height="60" rx="14" fill="#E89C18" opacity=".9"/>
  <!-- Finger -->
  <rect x="103" y="130" width="44" height="190" rx="22" fill="#E89C18" opacity=".9"/>
  <!-- Score line through finger -->
  <line x1="125" y1="138" x2="125" y2="315" stroke="#282420" stroke-width="8" stroke-linecap="round" opacity=".6"/>
  <!-- Nib split at tip -->
  <line x1="125" y1="138" x2="108" y2="168" stroke="#282420" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <line x1="125" y1="138" x2="142" y2="168" stroke="#282420" stroke-width="6" stroke-linecap="round" opacity=".45"/>

  <!-- Wordmark -->
  <text x="220" y="280" font-family="Georgia,'Times New Roman',serif" font-size="100" font-weight="700" font-style="italic" fill="#F0EDE4" letter-spacing="-3">Youth</text>
  <text x="220" y="390" font-family="Georgia,'Times New Roman',serif" font-size="100" font-weight="700" font-style="italic" fill="#E89C18" letter-spacing="-3">Front</text>
  <text x="220" y="460" font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="400" font-style="italic" fill="rgba(240,237,228,.3)" letter-spacing="-1">India.</text>

  <!-- Tagline -->
  <text x="220" y="520" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="rgba(240,237,228,.3)" letter-spacing=".5">Because the youth has words.</text>

  <!-- Bottom strip -->
  <rect x="0" y="592" width="1200" height="38" fill="#E89C18" opacity=".85"/>
  <text x="600" y="617" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#282420" text-anchor="middle">INDEPENDENT · NO PARTY · NO SPONSOR · EST. 2026</text>
</svg>
